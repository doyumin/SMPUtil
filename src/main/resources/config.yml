# SMPUtil 설정. 바꾼 뒤에는 서버를 재시작해야 반영된다.

nickname:
  # 닉네임 길이(글자 수). 최대값은 16을 넘을 수 없다: 마인크래프트 프로토콜이 플레이어 이름을 16자로 제한해서,
  # 더 긴 이름을 보내면 그 패킷을 받는 플레이어의 접속이 끊긴다.
  min-length: 1
  max-length: 16
  # 허용 문자(정규식). 닉네임 전체가 이 식에 맞아야 한다. 기본: 한글 완성형·영문·숫자·밑줄.
  allowed: "[가-힣A-Za-z0-9_]+"

home:
  # 끄면 /home, /sethome, /delhome 을 쓸 수 없다. 저장된 집은 지우지 않는다.
  enabled: true
  # 한 사람당 집 개수 상한
  max-homes: 1

teleport:
  # /home, /spawn, /tpa 수락 뒤 이동까지 기다리는 시간(초). 기다리는 동안 움직이면 취소된다. 0이면 바로 이동.
  # 임시값: 전투 중 도주용으로 쓰이면 운영 중에 늘린다.
  warmup-seconds: 0

tpa:
  # 텔레포트 요청이 만료되는 시간(초)
  expire-seconds: 15

trade:
  # 거래 요청이 만료되는 시간(초)
  expire-seconds: 15
  # 거래할 수 있는 최대 거리(블록). 0이면 제한 없음(다른 월드끼리도 된다). 임시값.
  max-distance: 0

suggestion:
  # 제안 한 건의 최대 글자 수
  max-length: 200
  # 같은 사람이 다음 제안을 보낼 수 있을 때까지의 시간(초). 도배 방지. 0이면 제한 없음.
  cooldown-seconds: 60
  # "/제안 으로 남겨 주세요" 안내를 전체 채팅에 보내는 간격(분). 0이면 보내지 않는다. 접속자가 없으면 보내지 않는다.
  reminder-minutes: 5
  # 새 제안을 알릴 디스코드 웹훅 주소. 비우면 알리지 않는다.
  # 이 주소를 아는 사람은 누구나 그 채널에 글을 쓸 수 있으므로 비밀이다: 저장소에는 절대 적지 말고,
  # 서버의 plugins/SMPUtil/config.yml 에만 적는다.
  discord-webhook-url: ""
