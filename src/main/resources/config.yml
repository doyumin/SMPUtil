# SMPUtil 설정. 바꾼 뒤에는 서버를 재시작해야 반영된다.

nickname:
  # 닉네임 길이(글자 수). 최대값은 16을 넘을 수 없다: 마인크래프트 프로토콜이 플레이어 이름을 16자로 제한해서,
  # 더 긴 이름을 보내면 그 패킷을 받는 플레이어의 접속이 끊긴다.
  min-length: 1
  max-length: 16
  # 허용 문자(정규식). 닉네임 전체가 이 식에 맞아야 한다. 기본: 한글 완성형·영문·숫자·밑줄.
  allowed: "[가-힣A-Za-z0-9_]+"

home:
  # 끄면 /home, /sethome, /delhome 을 쓸 수 없다. 저장된 집은 지우지 않는다.
  enabled: true
  # 한 사람당 집 개수 상한
  max-homes: 1

teleport:
  # /home, /spawn, /tpa 수락 뒤 이동까지 기다리는 시간(초). 기다리는 동안 움직이면 취소된다. 0이면 바로 이동.
  # 임시값: 전투 중 도주용으로 쓰이면 운영 중에 늘린다.
  warmup-seconds: 0

tpa:
  # 텔레포트 요청이 만료되는 시간(초)
  expire-seconds: 15

trade:
  # 거래 요청이 만료되는 시간(초)
  expire-seconds: 15
  # 거래할 수 있는 최대 거리(블록). 0이면 제한 없음(다른 월드끼리도 된다). 임시값.
  max-distance: 0
